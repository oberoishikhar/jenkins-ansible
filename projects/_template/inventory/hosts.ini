# =============================================================================
# Ansible Inventory — Target Hosts
# =============================================================================
# This file defines the servers where your playbooks will run.
# Format: https://docs.ansible.com/ansible/latest/user_guide/intro_inventory.html
#
# Generated/Modified by: ./add-project.sh
# =============================================================================

# ─── Define your target hosts ────────────────────────────────────────────────
[deploy_targets]
# Replace with your actual server IP/hostname
# Format: <hostname_or_ip>  [ansible_user=<user>]  [ansible_port=<port>]
# Example:
# 192.168.1.100 ansible_user=deployuser
# app.example.com ansible_user=ubuntu ansible_port=2222

# Add your target server(s) below:
template.local ansible_user=ansible

# ─── Group variables (apply to all hosts in [deploy_targets]) ────────────────
[deploy_targets:vars]
# SSH connection settings
ansible_ssh_private_key_file=/var/ssh-keys/template-project.pem
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=60'

# Ansible user for command execution
ansible_user=ansible
ansible_port=22

# Connection timeouts
ansible_connect_timeout=30
ansible_command_timeout=300

# Privilege escalation (uncomment if you need sudo)
# ansible_become=yes
# ansible_become_method=sudo
# ansible_become_user=root

# Other useful variables:
# ansible_python_interpreter=/usr/bin/python3  (if target uses Python 3)


# ─── Define host groups (optional) ───────────────────────────────────────────
# You can organize servers into logical groups

[webservers]
# Web application servers

[databases]
# Database servers

[all_servers:children]
deploy_targets
# webservers
# databases

# ─── Localhost (for local tasks) ─────────────────────────────────────────────
[local]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3
