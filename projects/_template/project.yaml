# =============================================================================
# Project Configuration Template
# =============================================================================
# This file defines metadata and settings for your project.
# Generated by: ./add-project.sh --name <project-name> ...
#
# Edit this file to customize deploy behavior, variables, etc.
# =============================================================================

# Short identifier for the project (letters, numbers, hyphens only)
# Must match the folder name exactly
name: "template-project"

# Human-friendly name shown in Jenkins UI
display_name: "Template Project"

# Description shown in job configuration
description: "Template project for Ansible deployments"

# Jenkins credentials ID for SSH key (auto-set by add-project.sh)
# Format: <project-name>-ssh-key
ssh_credential_id: "template-project-ssh-key"

# Default action when pipeline runs
# Options: deploy | rollback | healthcheck
default_action: deploy

# ─── Git Configuration (optional) ────────────────────────────────────────────
# If your playbooks live in a git repo, configure here
use_git: false
git_repo: ""                  # e.g., https://github.com/yourorg/ansible-playbooks.git
git_branch: "main"
git_credentials: ""           # Jenkins credential ID for git auth (if needed)

# ─── Deployment Target Hosts ────────────────────────────────────────────────
# These are DEFAULTS — actual hosts are in inventory/hosts.ini
default_host: "192.168.1.100"
default_user: "deployuser"
default_port: 22

# ─── Ansible Variables ──────────────────────────────────────────────────────
# These are passed to ansible-playbook via -e (extra variables)
ansible_variables:
  app_env: "production"
  app_version: "latest"
  # Add more as needed for your playbooks

# ─── Ansible Tags ───────────────────────────────────────────────────────────
# Only run plays with these tags (comma-separated)
# Leave empty to run all
ansible_tags: ""

# ─── Ansible Skip Tags ──────────────────────────────────────────────────────
# Skip plays with these tags
skip_tags: ""

# ─── Become/Sudo Configuration ──────────────────────────────────────────────
# Whether to use sudo for privileged tasks on the target host
use_become: false
become_method: "sudo"          # Options: sudo, su, pbrun, pfexec, doas, dzdo, ksu
become_user: "root"            # User to become (usually root)

# ─── SSH Connection Settings ────────────────────────────────────────────────
ssh_port: 22
ssh_timeout: 30                # Connection timeout in seconds
strict_host_key_checking: accept-new  # Options: accept-new | no | yes

# ─── Health Check Configuration ─────────────────────────────────────────────
# After deployment, run healthcheck playbook to verify
run_healthcheck: true
healthcheck_timeout: 300       # Seconds to wait for health checks

# ─── Rollback Configuration ─────────────────────────────────────────────────
# How many previous versions to keep for rollback
keep_versions: 5
rollback_on_failure: false     # Auto-rollback if deployment fails

# ─── Notifications ──────────────────────────────────────────────────────────
# Where to send deployment results
notifications:
  email: []                    # Email addresses
  slack:
    enabled: false
    channel: "#deployments"    # Slack channel
  webhooks: []                 # Custom webhook URLs

# ─── Approval & Gating ──────────────────────────────────────────────────────
# Require manual approval before deploying
require_approval: false
approvers: []                  # Jenkins usernames who can approve

# ─── Backup & Rollback ──────────────────────────────────────────────────────
# Backup configuration before deploying
backup_before_deploy: true
backup_location: "/var/backups"

# ─── Custom Hooks ───────────────────────────────────────────────────────────
# Scripts to run before/after deployment
pre_deploy_hook: ""            # Script path or command
post_deploy_hook: ""           # Script path or command
