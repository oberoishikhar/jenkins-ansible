---
# =============================================================================
# Rollback Playbook — Revert to previous version
# =============================================================================
# This playbook rolls back the application to a previous known-good version.
#
# Stages:
#   1. Validate: Confirm rollback backup exists
#   2. Stop: Stop current (broken) version
#   3. Restore: Restore from backup
#   4. Start: Start restored version
#   5. Verify: Run health checks
# =============================================================================

- name: Rollback Application
  hosts: deploy_targets
  gather_facts: yes

  vars:
    app_name: "template-app"
    app_home: "/opt/{{ app_name }}"
    backup_dir: "/var/backups/{{ app_name }}"
    rollback_timestamp: "{{ rollback_to | default('') }}"  # Pass via -e or Jenkins

  pre_tasks:
    - name: Preflight | Display rollback information
      debug:
        msg: |
          ╔════════════════════════════════════════════════════════════╗
          ║  ⏮️  ROLLING BACK {{ app_name }}
          ║  Target: {{ inventory_hostname }}
          ║  Restoring to: {{ rollback_timestamp | default('LATEST') }}
          ║  Time: {{ ansible_date_time.iso8601 }}
          ╚════════════════════════════════════════════════════════════╝
      run_once: yes

    - name: Preflight | Confirm rollback directory exists
      stat:
        path: "{{ backup_dir }}"
      register: backup_exists
      failed_when: backup_exists.stat.exists == False

    - name: Preflight | List available backups
      find:
        paths: "{{ backup_dir }}"
        file_type: directory
        age: "-30d"  # Only show last 30 days
      register: available_backups

    - name: Preflight | Show available backup versions
      debug:
        msg: "Available backups: {{ available_backups.files | map(attribute='path') | list }}"

  tasks:
    # ─── Find the backup to restore ────────────────────────────────────────────
    - name: Validate | Find latest backup
      find:
        paths: "{{ backup_dir }}"
        patterns: "app.tar.gz"
        age: "-30d"
        recurse: yes
      register: backup_files
      when: rollback_timestamp == ""

    - name: Validate | Select latest backup
      set_fact:
        restore_backup: "{{ backup_files.files | sort(attribute='mtime', reverse=True) | first }}"
      when: rollback_timestamp == "" and backup_files.files | length > 0

    - name: Validate | Use specified backup
      set_fact:
        restore_backup:
          path: "{{ backup_dir }}/{{ rollback_timestamp }}/app.tar.gz"
      when: rollback_timestamp != ""

    - name: Validate | Confirm backup exists
      stat:
        path: "{{ restore_backup.path }}"
      register: backup_check
      failed_when: backup_check.stat.exists == False

    # ─── Stop current version ──────────────────────────────────────────────────
    - name: Stop | Stop application service
      systemd:
        name: "{{ app_name }}"
        state: stopped
        daemon_reload: yes
      become: yes
      ignore_errors: yes

    - name: Stop | Give service time to cleanly shutdown
      wait_for:
        timeout: 10
      changed_when: false

    # ─── Restore from backup ───────────────────────────────────────────────────
    - name: Restore | Remove current version
      file:
        path: "{{ app_home }}"
        state: absent
      when: force_restore | default(false)
      ignore_errors: yes

    - name: Restore | Recreate application directory
      file:
        path: "{{ app_home }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Restore | Extract backup archive
      unarchive:
        src: "{{ restore_backup.path }}"
        dest: "{{ app_home }}"
        remote_src: yes
        creates: "{{ app_home }}/package.json"
      register: restore_result

    - name: Restore | Verify extraction
      stat:
        path: "{{ app_home }}"
      register: app_restored
      failed_when: app_restored.stat.exists == False

    # ─── Start restored version ────────────────────────────────────────────────
    - name: Start | Start application service
      systemd:
        name: "{{ app_name }}"
        state: started
        daemon_reload: yes
        enabled: yes
      become: yes
      register: start_result

    - name: Start | Wait for application to become ready
      uri:
        url: "http://localhost:8000/health"
        method: GET
        status_code: 200
      retries: 10
      delay: 3
      register: health_check
      until: health_check.status == 200
      ignore_errors: yes

  post_tasks:
    - name: Notify | Rollback complete
      debug:
        msg: |
          {% if restore_result.changed %}
          ✅ ROLLBACK SUCCESSFUL
          {% else %}
          ⚠️  Rollback status unclear — verify manually
          {% endif %}

          App: {{ app_name }}
          Host: {{ inventory_hostname }}
          Restored from: {{ restore_backup.path }}

          ⚠️  NEXT STEPS:
          1. Verify the application is working correctly
          2. Check logs: tail -f /var/log/{{ app_name }}.log
          3. Run health checks: ansible-playbook playbooks/healthcheck.yml
          4. If still broken, restore an earlier version

  handlers:
    - name: restart_app
      systemd:
        name: "{{ app_name }}"
        state: restarted
        daemon_reload: yes
      become: yes

# =============================================================================
# USAGE
# =============================================================================
#
# Rollback to LATEST backup:
#   ansible-playbook -i inventory/hosts.ini playbooks/rollback.yml
#
# Rollback to SPECIFIC timestamp:
#   ansible-playbook -i inventory/hosts.ini playbooks/rollback.yml \
#     -e "rollback_to=2024-01-15T10:30:00"
#
# Force restore (ignore current version):
#   ansible-playbook -i inventory/hosts.ini playbooks/rollback.yml \
#     -e "force_restore=true"
#
# =============================================================================
